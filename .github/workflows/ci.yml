name: ci

# Runs on every push + PR: quality (lint · type-check · test with a coverage
# floor), a web build (expo export), and a full-history secret scan. No repo
# secrets are required for the gates themselves.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # manual re-run from the Actions tab

jobs:
  quality:
    name: Lint · Type-check · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # PIN to the runtime you deploy on so a green CI run implies prod works.
          node-version: '22'
          cache: 'npm'

      - name: Lint · Type-check · Test
        # Root is an npm-workspaces monorepo: `npm ci` installs client/ too, and
        # each gate delegates into the workspace (see root package.json scripts).
        run: |
          npm ci
          npm run lint
          npm run typecheck            # HARD gate, no '|| true'
          npm run test:coverage        # runs the tests AND enforces the coverage floor (see vitest.config.ts)

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so gitleaks scans every commit
      - name: Install gitleaks
        run: |
          version=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" | tar -xz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan full history
        # `gitleaks detect` scans the entire git log, not just the push range, so
        # it is immune to the root-commit edge case in gitleaks-action@v2 (which
        # fails on the first push because the initial commit has no parent). Same
        # tool the local pre-commit Inspector runs. Exits non-zero on a find.
        run: gitleaks detect --no-banner --redact

  build:
    name: Build (web export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Export the web bundle
        # Proves the app actually builds (catches what typecheck can't, e.g. the
        # SPA/`window`-at-build-time class of error). deploy-web ships the same
        # export on push; this also gates pull requests, and keeps "it builds" a
        # first-class CI status. EXPO_PUBLIC_* are inlined at export; they are
        # public and a missing one resolves to "" without failing the build.
        run: npx expo export -p web
        working-directory: client
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Inject + verify the SPA SEO / social meta
        # output:'single' ignores +html.tsx, so the front-door meta is patched into the
        # export. Gate it here too: a broken patch fails CI, not the deploy.
        run: |
          node scripts/inject-web-meta.mjs
          grep -q 'property="og:image"' client/dist/index.html
          grep -q 'interactive-widget=resizes-content' client/dist/index.html
          grep -q 'id="dd-viewport"' client/dist/index.html
          # The static, crawlable landing page (lib/landing-page.ts): the page, its pre-paint boot, the four
          # language templates, the structured data and the canonical, plus the crawler files beside it.
          grep -q 'id="dd-landing"' client/dist/index.html
          grep -q 'id="dd-landing-boot"' client/dist/index.html
          test "$(grep -o '<template id="ddl-t-' client/dist/index.html | wc -l)" -eq 4
          grep -q 'application/ld+json' client/dist/index.html
          grep -q '<link rel="canonical" href="https://doubledone.app/"' client/dist/index.html
          grep -q '<h1 id="ddl-h1">' client/dist/index.html
          # One check per line: under bash -e, only the LAST command of an && list can fail the step.
          test -f client/dist/robots.txt
          test -f client/dist/sitemap.xml
          test -f client/dist/img/badges/app-store-en.svg
          test -f client/dist/img/badges/google-play-de.png
          # The redesign (2026-10-18): one action per platform, chosen by the boot before paint, and the six real
          # screens in every language and theme (the unit test checks all 60; this checks they reached the export).
          grep -q 'data-platform' client/dist/index.html
          grep -q 'class="act-desktop"' client/dist/index.html
          test "$(ls client/dist/landing/*.webp | wc -l)" -eq 60
          # Self-hosted fonts: the files ship, and nothing in the page asks Google for them.
          test -f client/dist/fonts/newsreader-600.woff2
          test -f client/dist/fonts/atkinson-400.woff2
          ! grep -rq 'fonts.googleapis.com' client/dist/index.html client/dist/_expo/static/css
      - name: Stamp + verify the version file
        # The app asks doubledone.app/version.json whether a newer build exists. Gate it here so a
        # broken stamp fails CI rather than the deploy, and so the file can never silently vanish
        # from the export: if it does, every build answers "cannot tell" and the check goes quietly
        # dead with nothing on screen to show for it.
        run: |
          node scripts/stamp-version.mjs
          node -e "const v=require('./client/dist/version.json'); const a=require('./client/app.json').expo.version; if(v.web!==a) throw new Error('version.json web '+v.web+' != app.json '+a); for(const k of ['ios','android']) if(typeof v[k]!=='string'||!v[k]) throw new Error('version.json missing '+k);"

